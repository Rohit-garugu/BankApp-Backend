spring.application.name=bank_app

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=${PORT:8080}
server.error.include-message=always

# JWT config
jwt.secret=${JWT_SECRET:bank-app-production-secret-key-change-me-please}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Security defaults
logging.level.org.springframework.security=INFO
