spring.application.name=bank_app

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis configuration (for OTP caching)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.timeout=60000

# Server
server.port=${PORT:8080}
server.error.include-message=always

# JWT config
jwt.secret=${JWT_SECRET:bank-app-production-secret-key-change-me-please}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Twilio SMS/OTP Configuration
twilio.account-sid=${TWILIO_ACCOUNT_SID:your-account-sid}
twilio.auth-token=${TWILIO_AUTH_TOKEN:your-auth-token}
twilio.phone-number=${TWILIO_PHONE_NUMBER:+1234567890}

# OTP Configuration
otp.length=6
otp.expiration-minutes=5

# Security defaults
logging.level.org.springframework.security=INFO